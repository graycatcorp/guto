<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GUTO — Terminal Financeiro · GrayCat</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  /* paleta vintage anos 60/70 — escritório / livro-caixa datilografado */
  --bg:#efe6d2; --bg2:#fbf7ec; --panel:#fbf7ec; --panel2:#e7dcc4;
  --line:#cdbf9f; --soft:#ece1c7; --txt:#2c2317; --muted:#8a7a5e; --head:#1e1810;
  --cyan:#2f6e6a; --cyan-dim:#4f7d79; --amber:#c89a3c; --green:#5f7d3a; --red:#b5432a;
  --ink:#2c2317;
  /* aliases herdados (mantêm estilos inline funcionando) */
  --navy:#1e1810; --navy2:#e7dcc4; --blue:#2f6e6a; --accent:#2f6e6a;
  --mono:'Courier Prime',ui-monospace,monospace;
  --disp:'Special Elite',var(--mono); --ui:'Courier Prime',ui-monospace,monospace;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--ui);font-size:15px;color:var(--txt);
  background:
    repeating-linear-gradient(transparent 0 37px,rgba(44,35,23,.045) 37px 38px),
    radial-gradient(900px 600px at 85% -10%,rgba(47,110,106,.06),transparent 60%),
    radial-gradient(800px 500px at -5% 110%,rgba(181,67,42,.05),transparent 55%),
    var(--bg);}
button{font-family:var(--ui);cursor:pointer}
input,select,textarea{font-family:var(--ui);font-size:15px}
.hidden{display:none!important}
::selection{background:rgba(47,110,106,.25);color:var(--head)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#cdbf9f;border-radius:0}
/* layout */
#app{display:flex;min-height:100vh}
.side{width:230px;background:linear-gradient(180deg,var(--panel2),#ddd0b3);color:#5a4d36;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;border-right:2px solid var(--ink)}
.brand{padding:18px 16px 14px;border-bottom:1px dashed var(--line);display:flex;align-items:center;gap:10px}
.brand-ico{width:42px;height:auto;flex:0 0 auto;mix-blend-mode:multiply}
.brand b{font-family:var(--disp);font-size:25px;color:var(--head);display:block;letter-spacing:1px;line-height:1}
.brand span{font-family:var(--mono);font-size:10px;color:#8a7a5e;letter-spacing:.5px;text-transform:uppercase}
.nav{margin-top:8px;flex:1}
.nav a{display:flex;gap:10px;align-items:center;padding:11px 16px;color:#5a4d36;text-decoration:none;font-weight:700;border-left:4px solid transparent;transition:.12s}
.nav a.active{background:rgba(47,110,106,.14);color:var(--cyan);border-left-color:var(--cyan)}
.nav a:hover{background:rgba(47,110,106,.07);color:var(--head)}
.who{padding:14px 16px;border-top:1px dashed var(--line);font-family:var(--mono);font-size:11px;color:var(--muted)}
.who b{color:var(--head);display:block;font-size:13px}
.who button{margin-top:8px;background:var(--bg2);border:1px solid var(--ink);color:var(--ink);border-radius:2px;padding:5px 10px;font-size:11px;font-family:var(--mono);box-shadow:2px 2px 0 rgba(44,35,23,.5)}
.who button:hover{background:#efe6d2}
.main{flex:1;min-width:0}
.top{background:rgba(251,247,236,.9);border-bottom:2px solid var(--ink);padding:14px 26px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
.top h1{margin:0;font-family:var(--disp);font-size:20px;color:var(--head);letter-spacing:.5px}
.top .yr{color:var(--muted);font-family:var(--mono);font-size:12px}
.top .yr b{color:var(--cyan)}
.wrap{padding:24px 26px;max-width:1180px}
/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:18px}
.card{background:var(--panel);border:1.5px solid var(--ink);border-radius:2px;padding:16px 18px;position:relative;overflow:hidden;box-shadow:4px 4px 0 rgba(44,35,23,.12)}
.card::before{content:"";position:absolute;left:0;top:0;width:26px;height:4px;background:var(--cyan)}
.card .lbl{font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.card .val{font-family:var(--mono);font-size:25px;font-weight:700;color:var(--head);margin-top:8px}
.card .sub{font-size:12px;color:var(--muted);margin-top:3px}
.card.green::before{background:var(--green)} .card.green .val{color:var(--green)}
.card.red::before{background:var(--red)} .card.red .val{color:var(--red)}
.card.amber::before{background:var(--amber)} .card.amber .val{color:#9a7320}
.panel{background:var(--panel);border:1.5px solid var(--ink);border-radius:2px;padding:18px;margin-bottom:18px;box-shadow:4px 4px 0 rgba(44,35,23,.1)}
.panel h3{margin:0 0 14px;font-family:var(--disp);font-size:16px;color:var(--head);display:flex;align-items:center;gap:9px;letter-spacing:.3px}
.panel h3::before{content:"";width:8px;height:8px;background:var(--ink);flex:0 0 auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}.side{width:64px}.brand span,.nav a span,.who,.brand-txt span{display:none}.brand{justify-content:center}.brand b{font-size:0;letter-spacing:0}}
/* table */
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 10px;border-bottom:1px dotted var(--line);font-size:13px}
td{color:var(--txt)}
th{background:var(--soft);color:var(--head);font-family:var(--mono);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.5px;position:sticky;border-bottom:1.5px solid var(--ink)}
tr:hover td{background:rgba(47,110,106,.06)}
td.r,th.r{text-align:right;font-family:var(--mono)}
.tag{display:inline-block;padding:2px 9px;border-radius:2px;font-family:var(--mono);font-size:11px;font-weight:700;border:1px solid transparent}
.tag.fix{background:rgba(47,110,106,.14);color:#2a625e;border-color:rgba(47,110,106,.5)}
.tag.var{background:rgba(200,154,60,.2);color:#8a6418;border-color:rgba(200,154,60,.6)}
.tag.pago{background:rgba(95,125,58,.18);color:#4c6630;border-color:rgba(95,125,58,.5)}
.tag.apagar{background:rgba(181,67,42,.14);color:#9a3a23;border-color:rgba(181,67,42,.5)}
.tag.prev{background:var(--soft);color:#7a6a4d;border-color:var(--line)}
.pill{font-family:var(--mono);font-size:11px;background:var(--soft);color:#6a5c40;padding:2px 8px;border-radius:2px;border:1px solid var(--line)}
/* buttons / forms */
.btn{background:var(--cyan);color:#fbf7ec;border:1.5px solid var(--ink);border-radius:2px;padding:8px 15px;font-weight:700;font-size:13px;letter-spacing:.3px;text-transform:uppercase;box-shadow:2px 2px 0 var(--ink)}
.btn:hover{background:#28605c;transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.btn.sec{background:var(--bg2);color:var(--ink)}
.btn.sec:hover{background:#efe6d2}
.btn.sm{padding:4px 9px;font-size:11px;box-shadow:2px 2px 0 rgba(44,35,23,.7)}
.btn.danger{background:var(--bg2);color:var(--red);border-color:var(--red);box-shadow:2px 2px 0 rgba(181,67,42,.6)}
.btn.danger:hover{background:rgba(181,67,42,.1)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar .sp{flex:1}
.toolbar b{font-family:var(--mono);color:var(--head)}
label.fld{display:block;margin-bottom:12px}
label.fld span{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px}
input.in,select.in,textarea.in{width:100%;padding:9px 10px;border:1.5px solid var(--ink);border-radius:2px;background:var(--bg2);color:var(--txt)}
input.in:focus,select.in:focus,textarea.in:focus{outline:none;border-color:var(--cyan);box-shadow:inset 0 0 0 1px var(--cyan)}
input.in:disabled,select.in:disabled{background:#e9dfc8;color:#a8997b;border-color:var(--line)}
select.in option{background:#fbf7ec}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(44,35,23,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto}
.modal{background:var(--panel);border:2px solid var(--ink);border-radius:2px;width:640px;max-width:100%;padding:24px;box-shadow:8px 8px 0 rgba(44,35,23,.25)}
.modal h2{margin:0 0 16px;font-family:var(--disp);color:var(--head);font-size:20px;letter-spacing:.3px}
.chk{width:18px;height:18px;cursor:pointer;accent-color:var(--cyan)}
.muted{color:var(--muted)}
/* ===== LOGIN ===== */
.center{position:relative;display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:hidden;background:#e7dcc4}
#matrix{position:absolute;inset:0;width:100%;height:100%;z-index:0;opacity:.16}
.center::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:repeating-linear-gradient(transparent 0 23px,rgba(44,35,23,.05) 23px 24px)}
.center::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 50%,transparent 45%,rgba(199,186,156,.8) 100%)}
.login{position:relative;z-index:2;background:var(--panel);
  border:2px solid var(--ink);border-radius:2px;padding:34px 32px 30px;width:404px;max-width:100%;
  box-shadow:8px 8px 0 rgba(44,35,23,.2)}
.login::before,.login::after{content:"";position:absolute;width:16px;height:16px;border:2px solid var(--cyan)}
.login::before{top:6px;left:6px;border-right:0;border-bottom:0}
.login::after{bottom:6px;right:6px;border-left:0;border-top:0}
.login .gtag{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;text-align:center}
.guto-row{display:flex;align-items:center;justify-content:center;gap:6px;margin:4px 0 2px}
.guto-ico{width:88px;height:auto;mix-blend-mode:multiply}
.guto-logo{font-family:var(--disp);font-size:64px;line-height:1;letter-spacing:3px;text-align:center;color:var(--head);text-shadow:3px 3px 0 rgba(47,110,106,.25)}
.login b{color:var(--cyan);font-family:var(--disp);font-size:20px}
.login>p{color:var(--muted);font-family:var(--mono);margin:2px 0 22px;font-size:11px;text-align:center;letter-spacing:.5px;text-transform:uppercase}
.who-pick{display:flex;flex-direction:column;gap:8px}
.who-pick button{padding:11px 14px;border:1.5px solid var(--ink);background:var(--bg2);border-radius:2px;text-align:left;font-weight:700;color:var(--ink);font-family:var(--mono);box-shadow:2px 2px 0 rgba(44,35,23,.4);transition:.12s}
.who-pick button:hover{background:rgba(47,110,106,.1);color:var(--cyan);transform:translate(1px,1px);box-shadow:1px 1px 0 rgba(44,35,23,.4)}
#localLogin>p{font-family:var(--mono);text-transform:uppercase;letter-spacing:.5px;font-size:11px;color:var(--head)!important}
.banner{background:rgba(200,154,60,.16);border:1px solid rgba(200,154,60,.6);color:#8a6418;padding:10px 14px;border-radius:2px;font-family:var(--mono);font-size:11px;margin-bottom:16px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px}
</style>
</head>
<body>

<!-- ===== LOGIN / PROFILE ===== -->
<div id="gate" class="center">
  <canvas id="matrix"></canvas>
  <div class="login">
    <div class="gtag">— GrayCat · Projeto GUTO · acesso restrito —</div>
    <div class="guto-row"><img class="guto-ico" src="guto-mascote.png" alt=""><div class="guto-logo">GUTO</div></div>
    <p>Livro-Caixa & Contábil</p>
    <div id="cloudLogin" class="hidden">
      <label class="fld"><span>Operador (e-mail)</span><input id="liEmail" class="in" type="email" placeholder="voce@empresa.com" autocomplete="username"></label>
      <label class="fld"><span>Senha</span><input id="liPass" class="in" type="password" autocomplete="current-password"></label>
      <div style="display:flex;gap:8px">
        <button class="btn" style="flex:1" onclick="cloudSignIn()">Entrar</button>
        <button class="btn sec" onclick="cloudSignUp()">Criar conta</button>
      </div>
      <p id="liMsg" style="color:var(--red);font-family:var(--mono);font-size:12px;margin-top:12px"></p>
    </div>
    <div id="localLogin">
      <p style="margin-bottom:12px">▸ Selecione o operador</p>
      <div id="whoPick" class="who-pick"></div>
    </div>
  </div>
</div>

<!-- ===== APP ===== -->
<div id="app" class="hidden">
  <aside class="side">
    <div class="brand"><img class="brand-ico" src="guto-mascote.png" alt="Guto"><div class="brand-txt"><b>Guto</b><span>Livro-Caixa &amp; Contábil</span></div></div>
    <nav class="nav" id="nav">
      <a data-v="dash" class="active">📊 <span>Dashboard</span></a>
      <a data-v="cad">🗂️ <span>Cadastro</span></a>
      <a data-v="ext">📑 <span>Extratos</span></a>
      <a data-v="ap">💰 <span>Aportes</span></a>
      <a data-v="cont">📘 <span>Contábil / Anual</span></a>
      <a data-v="cfg">⚙️ <span>Configurações</span></a>
    </nav>
    <div class="who">
      <span>Acessando como</span>
      <b id="whoName">—</b>
      <button onclick="logout()">Trocar / Sair</button>
    </div>
  </aside>
  <div class="main">
    <div class="top">
      <h1 id="viewTitle">Dashboard</h1>
      <div class="yr">Ano <b id="topYear">2026</b> · moeda R$ · <span id="topMode" class="pill">local</span></div>
    </div>
    <div class="wrap" id="view"></div>
  </div>
</div>

<script>
/* =========================================================
   CONFIG — nuvem (login + dados compartilhados)
   Para ativar: preencha as 2 chaves do seu projeto Supabase.
   Vazio = modo local (dados só neste navegador).
========================================================= */
const SUPABASE_URL = "https://hzznxohbrwhgxuzvkwmr.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_4Pz56s6NaJmTXbshMQgA9A_tZ7Ai2HJ";
const ORG_ID = "guto-graycat";
let sb=null, CLOUD=!!(SUPABASE_URL&&SUPABASE_ANON_KEY);

/* ============ MODELO / ESTADO ============ */
const MA=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
const MF=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const TIPOS=["Infra","Mkt","adm","impostos","contabil","trafego pago Meta","trafego pago tik tok"];
const METODOS=["Pix","Saldo","Cartão de crédito","Aporte Sócio"];
const fmt=n=>"R$ "+(Number(n)||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
let S=null;            // estado
let currentUser=null;  // {id,name,email}
let curMonth=new Date().getMonth();

function seed(){
  return {
    settings:{org:"GrayCat - Projeto GUTO", year:2026, defaultDay:5, aporteDay:5,
      socios:[{id:"s1",name:"Sócio 1"},{id:"s2",name:"Sócio 2"},{id:"s3",name:"Sócio 3"}]},
    costs:[
      c("Google Workspace (e-mail/Drive)","adm","Mensal","Fixo",196,"Jun","Indeterminado","À vista",0,5,"Cartão de crédito","Contas do time."),
      c("Google Cloud & API","Infra","Mensal","Variável",50,"Jun","Indeterminado","À vista",0,5,"Cartão de crédito","Valor é prévia; medir no console."),
      c("Claude (desenvolvimento)","Infra","Mensal","Fixo",550,"Jun","Indeterminado","À vista",0,5,"Cartão de crédito","Assinatura de dev."),
      c("Contabilidade","contabil","Mensal","Fixo",274,"Jun","Indeterminado","À vista",0,5,"Pix","Honorários contábeis."),
      c("API Esportes (sports mode)","Infra","Mensal","Fixo",110,"Jun","Indeterminado","À vista",0,5,"Cartão de crédito","Feed esportivo."),
      c("Meta Business","Mkt","Mensal","Fixo",120,"Jun","Indeterminado","À vista",0,5,"Cartão de crédito","Assinatura/verificação Meta."),
      c("TFF Prefeitura (alvará)","impostos","Anual","Fixo",1456,"Jun","","À vista",0,10,"Pix","Taxa anual. Conferir mês real."),
    ],
    payments:{},  // "costId|m": {pago:bool, valorReal:num|null}
    aportes:{}    // "socioId|m": {feito:bool, data:"YYYY-MM-DD"}
  };
}
function c(desc,tipo,per,classe,valor,ini,fim,pag,q,dia,met,obs,by){
  return {id:uid(),desc,tipo,periodicidade:per,classe,valor:Number(valor),mesIni:ini,mesFim:fim,
    pagamento:pag,qtde:Number(q)||0,dia:Number(dia)||0,metodo:met,obs:obs||"",by:by||"",at:""};
}

/* ============ LÓGICA ============ */
function occMonth(m){ // ocorrências do mês m (0-11)
  const out=[];
  for(const k of S.costs){
    const mi=MA.indexOf(k.mesIni);
    if(mi<0) continue;
    let appear=false, base=0, parc="";
    if(k.periodicidade==="Mensal"){
      let mf = k.mesFim==="Indeterminado"?11:(MA.indexOf(k.mesFim)>=0?MA.indexOf(k.mesFim):mi);
      if(m>=mi && m<=mf){appear=true; base=k.valor;}
    } else { // Esporádico / Anual
      const parcelado = k.pagamento==="Parcelado";
      const q = parcelado?Math.max(1,k.qtde||1):1;
      const idx = m-mi+1;
      if(idx>=1 && idx<=q){appear=true; base=k.valor/q; if(q>1)parc=idx+"/"+q;}
    }
    if(!appear) continue;
    const pkey=k.id+"|"+m;
    const pay=S.payments[pkey]||{};
    const isVar=k.classe==="Variável";
    const hasReal=pay.valorReal!=null && pay.valorReal!=="";
    const value = (isVar && hasReal)? Number(pay.valorReal):base;
    out.push({cost:k, key:pkey, value, base, parcela:parc, pago:!!pay.pago,
      preview:isVar && !hasReal, valorReal: hasReal?Number(pay.valorReal):null});
  }
  return out;
}
const monthTotal=m=>occMonth(m).reduce((s,o)=>s+o.value,0);
const nSoc=()=>S.settings.socios.length||1;
const perSocio=m=>monthTotal(m)/nSoc();
function monthStatus(m){let pago=0,apagar=0;for(const o of occMonth(m)){o.pago?pago+=o.value:apagar+=o.value;}return{pago,apagar};}
function aporteState(m){
  const share=perSocio(m); let feito=0;
  const list=S.settings.socios.map(s=>{
    const a=S.aportes[s.id+"|"+m]||{};
    if(a.feito)feito+=share;
    return {socio:s, share, feito:!!a.feito, data:a.data||""};
  });
  return {share, needed:monthTotal(m), aportado:feito, pendente:monthTotal(m)-feito, list};
}
const yearTotal=()=>{let t=0;for(let m=0;m<12;m++)t+=monthTotal(m);return t;};

/* ============ PERSISTÊNCIA ============ */
const LS="guto_state_v1";
async function loadState(){
  if(CLOUD){
    const {data,error}=await sb.from("app_state").select("data").eq("id",ORG_ID).maybeSingle();
    if(error){console.warn(error);}
    const valid = data && data.data && data.data.settings && Array.isArray(data.data.costs);
    S = valid ? data.data : seed();
    if(!valid){ await sb.from("app_state").upsert({id:ORG_ID,data:S,updated_at:new Date().toISOString()}); }
  } else {
    const raw=localStorage.getItem(LS);
    S = raw? JSON.parse(raw): seed();
  }
}
let saveT=null;
function save(){
  if(CLOUD){ clearTimeout(saveT); saveT=setTimeout(async()=>{
      await sb.from("app_state").upsert({id:ORG_ID,data:S,updated_at:new Date().toISOString()});
    },400);
  } else { localStorage.setItem(LS,JSON.stringify(S)); }
  if(typeof render==="function") render();
}

/* ============ LOGIN ============ */
async function boot(){
  document.getElementById("topMode").textContent = CLOUD?"nuvem":"local";
  if(CLOUD){
    sb = supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
    document.getElementById("cloudLogin").classList.remove("hidden");
    document.getElementById("localLogin").classList.add("hidden");
    const {data}=await sb.auth.getSession();
    if(data.session){ currentUser={id:data.session.user.id,name:data.session.user.email,email:data.session.user.email}; await enter(); }
  } else {
    await loadState();
    renderWhoPick();
  }
}
function renderWhoPick(){
  const w=document.getElementById("whoPick"); w.innerHTML="";
  S.settings.socios.forEach(s=>{
    const b=document.createElement("button");
    b.textContent="👤 "+s.name;
    b.onclick=()=>{currentUser={id:s.id,name:s.name}; enter();};
    w.appendChild(b);
  });
  const adm=document.createElement("button");
  adm.textContent="🏢 Visão da empresa (admin)";
  adm.onclick=()=>{currentUser={id:"admin",name:"Empresa"}; enter();};
  w.appendChild(adm);
}
function readCreds(){
  const email=(liEmail.value||"").trim(), password=liPass.value||"";
  if(!email||!password){ liMsg.textContent="Informe o operador (e-mail) e a senha."; return null; }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ liMsg.textContent="O operador deve ser um e-mail válido (ex.: voce@empresa.com)."; return null; }
  if(password.length<6){ liMsg.textContent="A senha precisa ter ao menos 6 caracteres."; return null; }
  liMsg.textContent=""; return {email,password};
}
async function cloudSignIn(){
  const cr=readCreds(); if(!cr) return;
  const {data,error}=await sb.auth.signInWithPassword(cr);
  if(error){liMsg.textContent=error.message;return;}
  currentUser={id:data.user.id,name:cr.email,email:cr.email}; await enter();
}
async function cloudSignUp(){
  const cr=readCreds(); if(!cr) return;
  const {error}=await sb.auth.signUp(cr);
  liMsg.textContent = error? error.message : "Conta criada! Confirme o e-mail (se exigido) e clique em Entrar.";
}
async function enter(){
  if(CLOUD && !S) await loadState();
  document.getElementById("gate").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  document.getElementById("whoName").textContent=currentUser.name;
  document.getElementById("topYear").textContent=S.settings.year;
  render();
}
async function logout(){
  if(CLOUD&&sb){await sb.auth.signOut();}
  currentUser=null;
  document.getElementById("app").classList.add("hidden");
  document.getElementById("gate").classList.remove("hidden");
  if(!CLOUD) renderWhoPick();
}

function vCad(){

  ${S.costs.map(k=>`<tr>
    <td><b>${esc(k.desc)}</b>${k.obs?`<br><span class="muted" style="font-size:11px">${esc(k.obs)}</span>`:""}</td>

function periodLabel(k){
  if(k.periodicidade==="Mensal")return `${k.mesIni} → ${k.mesFim||"?"}`;
  return `${k.mesIni}${k.qtde>1&&k.pagamento==="Parcelado"?` (${k.qtde}x)`:""}`;
}
function editCost(id){
  const k=id?S.costs.find(x=>x.id===id):c("","Infra","Mensal","Fixo",0,"Jun","Indeterminado","À vista",0,5,"Pix","");
  const isNew=!id;
  const opt=(arr,sel)=>arr.map(o=>`<option ${o===sel?"selected":""}>${o}</option>`).join("");
  showModal(`<h2>${isNew?"Novo custo":"Editar custo"}</h2>
  <div class="formgrid">
    <label class="fld" style="grid-column:1/3"><span>Descrição</span><input id="f_desc" class="in" value="${esc(k.desc)}"></label>
    <label class="fld"><span>Tipo do gasto</span><select id="f_tipo" class="in">${opt(TIPOS,k.tipo)}</select></label>
    <label class="fld"><span>Periodicidade</span><select id="f_per" class="in" onchange="condFields()">${opt(["Mensal","Anual","Esporádico"],k.periodicidade)}</select></label>
    <label class="fld"><span>Classe</span><select id="f_cls" class="in">${opt(["Fixo","Variável"],k.classe)}</select></label>
    <label class="fld"><span>Valor previsto (R$) <span class="muted">— variável = prévia</span></span><input id="f_val" class="in" type="number" step="0.01" value="${k.valor}"></label>
    <label class="fld"><span id="lblIni">Mês início / referência</span><select id="f_ini" class="in">${opt(MA,k.mesIni)}</select></label>
    <label class="fld" id="wrapFim"><span>Mês fim (Mensal)</span><select id="f_fim" class="in">${opt(["Indeterminado",...MA],k.mesFim||"Indeterminado")}</select></label>
    <label class="fld" id="wrapPag"><span>Pagamento</span><select id="f_pag" class="in" onchange="condFields()">${opt(["À vista","Parcelado"],k.pagamento)}</select></label>
    <label class="fld" id="wrapQt"><span>Qtde de parcelas</span><input id="f_qt" class="in" type="number" min="1" value="${k.qtde||1}"></label>
    <label class="fld"><span>Dia de vencimento</span><input id="f_dia" class="in" type="number" min="1" max="28" value="${k.dia||5}"></label>
    <label class="fld"><span>Método de pagamento</span><select id="f_met" class="in">${opt(METODOS,k.metodo)}</select></label>
    <label class="fld" style="grid-column:1/3"><span>Observações</span><textarea id="f_obs" class="in" rows="2">${esc(k.obs)}</textarea></label>
  </div>
  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:6px">
    <button class="btn sec" onclick="closeModal()">Cancelar</button>
    <button class="btn" onclick="saveCost('${k.id}',${isNew})">Salvar</button></div>`);
  condFields();
}
function condFields(){
  const per=document.getElementById("f_per").value;
  const mensal=per==="Mensal";
  document.getElementById("wrapFim").style.opacity=mensal?1:.4;
  document.getElementById("f_fim").disabled=!mensal;
  document.getElementById("lblIni").textContent=mensal?"Mês de início":"Mês de referência";
  document.getElementById("wrapPag").style.opacity=mensal?.4:1;
  document.getElementById("f_pag").disabled=mensal;
  const parc=!mensal && document.getElementById("f_pag").value==="Parcelado";
  document.getElementById("wrapQt").style.opacity=parc?1:.4;
  document.getElementById("f_qt").disabled=!parc;
}
function saveCost(id,isNew){
  const g=x=>document.getElementById(x).value;
  const per=g("f_per");
  const obj={id, desc:g("f_desc").trim(), tipo:g("f_tipo"), periodicidade:per, classe:g("f_cls"),
    valor:Number(g("f_val"))||0, mesIni:g("f_ini"),
    mesFim: per==="Mensal"? g("f_fim"):"",
    pagamento: per==="Mensal"? "À vista": g("f_pag"),
    qtde: (per!=="Mensal"&&g("f_pag")==="Parcelado")? Number(g("f_qt"))||1:0,
    dia:Number(g("f_dia"))||5, metodo:g("f_met"), obs:g("f_obs").trim()};
  if(!obj.desc){alert("Informe a descrição.");return;}
  if(isNew){
    obj.by=(currentUser&&currentUser.name)||"—";
    obj.at=new Date().toISOString().slice(0,10);
    S.costs.push(obj);
  } else {
    const old=S.costs.find(x=>x.id===id)||{};
    obj.by=old.by||""; obj.at=old.at||"";   // preserva quem cadastrou
    const i=S.costs.findIndex(x=>x.id===id); S.costs[i]=obj;
  }
  closeModal(); save();
}
function delCost(id){ if(!confirm("Excluir este custo?"))return; S.costs=S.costs.filter(x=>x.id!==id);
  Object.keys(S.payments).forEach(k=>{if(k.startsWith(id+"|"))delete S.payments[k];}); save(); }

    <label class="fld"><span>Nome</span><input class="in" value="${esc(s.org)}" onchange="S.settings.org=this.value;save()"></label>
    <label class="fld"><span>Ano de referência</span><input class="in" type="number" value="${s.year}" onchange="S.settings.year=+this.value;document.getElementById('topYear').textContent=this.value;save()"></label>
    <label class="fld"><span>Dia padrão de vencimento (mensal)</span><input class="in" type="number" value="${s.defaultDay}" onchange="S.settings.defaultDay=+this.value;save()"></label>
  </div>
  <h3 style="margin-top:14px">Sócios (${s.socios.length}) — a divisão é ÷${s.socios.length}</h3>
  <table><tbody>${s.socios.map((x,i)=>`<tr><td><input class="in" value="${esc(x.name)}" onchange="S.settings.socios[${i}].name=this.value;save()"></td>
    <td style="width:60px"><button class="btn danger sm" onclick="delSocio('${x.id}')">remover</button></td></tr>`).join("")}</tbody></table>
  <button class="btn sec sm" style="margin-top:10px" onclick="addSocio()">+ Adicionar sócio</button></div>
  <div class="panel"><h3>Dados & nuvem</h3>
   <p class="muted">Modo atual: <b>${CLOUD?"nuvem (login + compartilhado)":"local (só neste navegador)"}</b>. Para login dos sócios em computadores diferentes, ative a nuvem seguindo o guia de configuração (Supabase).</p>
   <button class="btn sec" onclick="exportJSON()">⬇️ Backup (JSON)</button>
   <label class="btn sec" style="display:inline-block"><input type="file" accept=".json" style="display:none" onchange="importJSON(this.files[0])">⬆️ Restaurar backup</label>
  </div>`;
}
function addSocio(){S.settings.socios.push({id:uid(),name:"Novo sócio"});save();}
function delSocio(id){if(S.settings.socios.length<=1)return;if(!confirm("Remover sócio?"))return;S.settings.socios=S.settings.socios.filter(x=>x.id!==id);save();}

/* ============ EXPORT / IMPORT ============ */
function exportJSON(){dl("guto_backup.json",JSON.stringify(S,null,2),"application/json");}
function importJSON(file){const r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);save();alert("Backup restaurado.");}catch(e){alert("Arquivo inválido.");}};r.readAsText(file);}
function exportCSV(){
  let rows=[["Mes","Venc","Descricao","Tipo","Periodicidade","Classe","Valor","Parcela","Metodo","Status"]];
  for(let m=0;m<12;m++)occMonth(m).forEach(o=>rows.push([MA[m],String(o.cost.dia||5).padStart(2,"0")+"/"+String(m+1).padStart(2,"0"),
    o.cost.desc,o.cost.tipo,o.cost.periodicidade,o.cost.classe,o.value.toFixed(2),o.parcela,o.cost.metodo,o.pago?"Pago":"A pagar"]));
  dl("guto_extrato_"+S.settings.year+".csv",rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(";")).join("\n"),"text/csv");
}
function dl(name,content,type){const b=new Blob([content],{type});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;a.click();}

/* ============ UTIL / MODAL ============ */
function esc(s){return String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function showModal(html){let o=document.createElement("div");o.className="ov";o.id="ov";o.innerHTML=`<div class="modal">${html}</div>`;o.onclick=e=>{if(e.target===o)closeModal();};document.body.appendChild(o);}
function closeModal(){const o=document.getElementById("ov");if(o)o.remove();}

/* ============ MATRIX RAIN (login) ============ */
(function(){
  const cv=document.getElementById("matrix"); if(!cv) return;
  const ctx=cv.getContext("2d");
  const glyphs="ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789$%#&*@=+-/.,;:GUTO".split("");
  let cols=[], w=0, h=0, font=18;
  function resize(){
    w=cv.width=cv.clientWidth; h=cv.height=cv.clientHeight;
    const n=Math.floor(w/font); cols=Array.from({length:n},()=>Math.random()*-50);
  }
  function draw(){
    const gate=document.getElementById("gate");
    if(gate && !gate.classList.contains("hidden")){
      ctx.fillStyle="rgba(231,220,196,.10)"; ctx.fillRect(0,0,w,h);   // rastro creme
      ctx.font=font+"px 'Courier Prime',monospace";
      for(let i=0;i<cols.length;i++){
        const x=i*font, y=cols[i]*font;
        const ch=glyphs[(Math.random()*glyphs.length)|0];
        ctx.fillStyle="rgba(44,35,23,.75)"; ctx.fillText(ch,x,y);        // letra entintada
        ctx.fillStyle="rgba(47,110,106,.45)"; ctx.fillText(ch,x,y-font); // rastro teal desbotado
        if(y>h && Math.random()>0.975) cols[i]=Math.random()*-20;
        cols[i]+=0.45;   // datilografia lenta
      }
    }
    requestAnimationFrame(draw);
  }
  const reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  resize(); window.addEventListener("resize",resize);
  if(reduce){ ctx.fillStyle="rgba(231,220,196,.92)"; ctx.fillRect(0,0,w,h); } else { draw(); }
})();

/* ============ START ============ */
if(window.Chart){
  Chart.defaults.color="#6a5c40";
  Chart.defaults.borderColor="rgba(44,35,23,.14)";
  Chart.defaults.font.family="'Courier Prime', monospace";
}
if(CLOUD){
  const sc=document.createElement("script");sc.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
  sc.onload=boot;document.head.appendChild(sc);
}else{boot();}
</script>
