<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GUTO — Terminal Financeiro · GrayCat</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  /* paleta vintage anos 60/70 — escritório / livro-caixa datilografado */
  --bg:#efe6d2; --bg2:#fbf7ec; --panel:#fbf7ec; --panel2:#e7dcc4;
  --line:#cdbf9f; --soft:#ece1c7; --txt:#2c2317; --muted:#8a7a5e; --head:#1e1810;
  --cyan:#2f6e6a; --cyan-dim:#4f7d79; --amber:#c89a3c; --green:#5f7d3a; --red:#b5432a;
  --ink:#2c2317;
  /* aliases herdados (mantêm estilos inline funcionando) */
  --navy:#1e1810; --navy2:#e7dcc4; --blue:#2f6e6a; --accent:#2f6e6a;
  --mono:'Courier Prime',ui-monospace,monospace;
  --disp:'Special Elite',var(--mono); --ui:'Courier Prime',ui-monospace,monospace;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--ui);font-size:15px;color:var(--txt);
  background:
    repeating-linear-gradient(transparent 0 37px,rgba(44,35,23,.045) 37px 38px),
    radial-gradient(900px 600px at 85% -10%,rgba(47,110,106,.06),transparent 60%),
    radial-gradient(800px 500px at -5% 110%,rgba(181,67,42,.05),transparent 55%),
    var(--bg);}
button{font-family:var(--ui);cursor:pointer}
input,select,textarea{font-family:var(--ui);font-size:15px}
.hidden{display:none!important}
::selection{background:rgba(47,110,106,.25);color:var(--head)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#cdbf9f;border-radius:0}
/* layout */
#app{display:flex;min-height:100vh}
.side{width:230px;background:linear-gradient(180deg,var(--panel2),#ddd0b3);color:#5a4d36;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;border-right:2px solid var(--ink)}
.brand{padding:18px 16px 14px;border-bottom:1px dashed var(--line);display:flex;align-items:center;gap:10px}
.brand-ico{width:48px;height:48px;flex:0 0 auto;border-radius:50%;border:2px solid var(--ink);background:var(--bg2);object-fit:cover;box-shadow:2px 2px 0 rgba(44,35,23,.3)}
.brand b{font-family:var(--disp);font-size:25px;color:var(--head);display:block;letter-spacing:1px;line-height:1}
.brand span{font-family:var(--mono);font-size:10px;color:#8a7a5e;letter-spacing:.5px;text-transform:uppercase}
.nav{margin-top:8px;flex:1}
.nav a{display:flex;gap:10px;align-items:center;padding:11px 16px;color:#5a4d36;text-decoration:none;font-weight:700;border-left:4px solid transparent;transition:.12s}
.nav a.active{background:rgba(47,110,106,.14);color:var(--cyan);border-left-color:var(--cyan)}
.nav a:hover{background:rgba(47,110,106,.07);color:var(--head)}
.who{padding:14px 16px;border-top:1px dashed var(--line);font-family:var(--mono);font-size:11px;color:var(--muted)}
.who b{color:var(--head);display:block;font-size:13px}
.who button{margin-top:8px;background:var(--bg2);border:1px solid var(--ink);color:var(--ink);border-radius:2px;padding:5px 10px;font-size:11px;font-family:var(--mono);box-shadow:2px 2px 0 rgba(44,35,23,.5)}
.who button:hover{background:#efe6d2}
.main{flex:1;min-width:0}
.top{background:rgba(251,247,236,.9);border-bottom:2px solid var(--ink);padding:14px 26px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
.top h1{margin:0;font-family:var(--disp);font-size:20px;color:var(--head);letter-spacing:.5px}
.top .yr{color:var(--muted);font-family:var(--mono);font-size:12px}
.top .yr b{color:var(--cyan)}
.wrap{padding:24px 26px;max-width:1180px}
/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:18px}
.card{background:var(--panel);border:1.5px solid var(--ink);border-radius:2px;padding:16px 18px;position:relative;overflow:hidden;box-shadow:4px 4px 0 rgba(44,35,23,.12)}
.card::before{content:"";position:absolute;left:0;top:0;width:26px;height:4px;background:var(--cyan)}
.card .lbl{font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.card .val{font-family:var(--mono);font-size:25px;font-weight:700;color:var(--head);margin-top:8px}
.card .sub{font-size:12px;color:var(--muted);margin-top:3px}
.card.green::before{background:var(--green)} .card.green .val{color:var(--green)}
.card.red::before{background:var(--red)} .card.red .val{color:var(--red)}
.card.amber::before{background:var(--amber)} .card.amber .val{color:#9a7320}
.panel{background:var(--panel);border:1.5px solid var(--ink);border-radius:2px;padding:18px;margin-bottom:18px;box-shadow:4px 4px 0 rgba(44,35,23,.1)}
.panel h3{margin:0 0 14px;font-family:var(--disp);font-size:16px;color:var(--head);display:flex;align-items:center;gap:9px;letter-spacing:.3px}
.panel h3::before{content:"";width:8px;height:8px;background:var(--ink);flex:0 0 auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}.side{width:64px}.brand span,.nav a span,.who,.brand-txt span{display:none}.brand{justify-content:center}.brand b{font-size:0;letter-spacing:0}}
/* table */
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 10px;border-bottom:1px dotted var(--line);font-size:13px}
td{color:var(--txt)}
th{background:var(--soft);color:var(--head);font-family:var(--mono);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.5px;position:sticky;border-bottom:1.5px solid var(--ink)}
tr:hover td{background:rgba(47,110,106,.06)}
td.r,th.r{text-align:right;font-family:var(--mono)}
.tag{display:inline-block;padding:2px 9px;border-radius:2px;font-family:var(--mono);font-size:11px;font-weight:700;border:1px solid transparent}
.tag.fix{background:rgba(47,110,106,.14);color:#2a625e;border-color:rgba(47,110,106,.5)}
.tag.var{background:rgba(200,154,60,.2);color:#8a6418;border-color:rgba(200,154,60,.6)}
.tag.pago{background:rgba(95,125,58,.18);color:#4c6630;border-color:rgba(95,125,58,.5)}
.tag.apagar{background:rgba(181,67,42,.14);color:#9a3a23;border-color:rgba(181,67,42,.5)}
.tag.prev{background:var(--soft);color:#7a6a4d;border-color:var(--line)}
.pill{font-family:var(--mono);font-size:11px;background:var(--soft);color:#6a5c40;padding:2px 8px;border-radius:2px;border:1px solid var(--line)}
/* buttons / forms */
.btn{background:var(--cyan);color:#fbf7ec;border:1.5px solid var(--ink);border-radius:2px;padding:8px 15px;font-weight:700;font-size:13px;letter-spacing:.3px;text-transform:uppercase;box-shadow:2px 2px 0 var(--ink)}
.btn:hover{background:#28605c;transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.btn.sec{background:var(--bg2);color:var(--ink)}
.btn.sec:hover{background:#efe6d2}
.btn.sm{padding:4px 9px;font-size:11px;box-shadow:2px 2px 0 rgba(44,35,23,.7)}
.btn.danger{background:var(--bg2);color:var(--red);border-color:var(--red);box-shadow:2px 2px 0 rgba(181,67,42,.6)}
.btn.danger:hover{background:rgba(181,67,42,.1)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar .sp{flex:1}
.toolbar b{font-family:var(--mono);color:var(--head)}
label.fld{display:block;margin-bottom:12px}
label.fld span{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px}
input.in,select.in,textarea.in{width:100%;padding:9px 10px;border:1.5px solid var(--ink);border-radius:2px;background:var(--bg2);color:var(--txt)}
input.in:focus,select.in:focus,textarea.in:focus{outline:none;border-color:var(--cyan);box-shadow:inset 0 0 0 1px var(--cyan)}
input.in:disabled,select.in:disabled{background:#e9dfc8;color:#a8997b;border-color:var(--line)}
select.in option{background:#fbf7ec}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(44,35,23,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto}
.modal{background:var(--panel);border:2px solid var(--ink);border-radius:2px;width:640px;max-width:100%;padding:24px;box-shadow:8px 8px 0 rgba(44,35,23,.25)}
.modal h2{margin:0 0 16px;font-family:var(--disp);color:var(--head);font-size:20px;letter-spacing:.3px}
.chk{width:18px;height:18px;cursor:pointer;accent-color:var(--cyan)}
.muted{color:var(--muted)}
/* segmented toggle (Custos / Receitas) */
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:2px;overflow:hidden;box-shadow:2px 2px 0 rgba(44,35,23,.4)}
.segb{background:var(--bg2);border:0;padding:8px 18px;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.3px;color:var(--ink)}
.segb.on{background:var(--cyan);color:#fbf7ec}
.segb+.segb{border-left:1.5px solid var(--ink)}
.in-up{color:var(--green);font-weight:700} .in-dn{color:var(--red);font-weight:700}
/* ===== LOGIN ===== */
.center{position:relative;display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:hidden;background:#e7dcc4}
#matrix{position:absolute;inset:0;width:100%;height:100%;z-index:0;opacity:.16}
.center::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:repeating-linear-gradient(transparent 0 23px,rgba(44,35,23,.05) 23px 24px)}
.center::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 50%,transparent 45%,rgba(199,186,156,.8) 100%)}
.login{position:relative;z-index:2;background:var(--panel);
  border:2px solid var(--ink);border-radius:2px;padding:34px 32px 30px;width:404px;max-width:100%;
  box-shadow:8px 8px 0 rgba(44,35,23,.2)}
.login::before,.login::after{content:"";position:absolute;width:16px;height:16px;border:2px solid var(--cyan)}
.login::before{top:6px;left:6px;border-right:0;border-bottom:0}
.login::after{bottom:6px;right:6px;border-left:0;border-top:0}
.login .gtag{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;text-align:center}
.guto-row{display:flex;align-items:center;justify-content:center;gap:6px;margin:4px 0 2px}
.guto-ico{width:108px;height:108px;border-radius:50%;border:2.5px solid var(--ink);background:var(--bg2);object-fit:cover;box-shadow:3px 3px 0 rgba(47,110,106,.3)}
.guto-logo{font-family:var(--disp);font-size:64px;line-height:1;letter-spacing:3px;text-align:center;color:var(--head);text-shadow:3px 3px 0 rgba(47,110,106,.25)}
.login b{color:var(--cyan);font-family:var(--disp);font-size:20px}
.login>p{color:var(--muted);font-family:var(--mono);margin:2px 0 22px;font-size:11px;text-align:center;letter-spacing:.5px;text-transform:uppercase}
.who-pick{display:flex;flex-direction:column;gap:8px}
.who-pick button{padding:11px 14px;border:1.5px solid var(--ink);background:var(--bg2);border-radius:2px;text-align:left;font-weight:700;color:var(--ink);font-family:var(--mono);box-shadow:2px 2px 0 rgba(44,35,23,.4);transition:.12s}
.who-pick button:hover{background:rgba(47,110,106,.1);color:var(--cyan);transform:translate(1px,1px);box-shadow:1px 1px 0 rgba(44,35,23,.4)}
#localLogin>p{font-family:var(--mono);text-transform:uppercase;letter-spacing:.5px;font-size:11px;color:var(--head)!important}
.banner{background:rgba(200,154,60,.16);border:1px solid rgba(200,154,60,.6);color:#8a6418;padding:10px 14px;border-radius:2px;font-family:var(--mono);font-size:11px;margin-bottom:16px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px}
/* ===== PRODUTOS / CENTROS DE CUSTO ===== */
.product-hero{background:linear-gradient(135deg,rgba(47,110,106,.13),rgba(200,154,60,.12));border:2px solid var(--ink);padding:20px;margin-bottom:18px;box-shadow:6px 6px 0 rgba(44,35,23,.13)}
.product-hero h2{font-family:var(--disp);margin:0 0 7px;font-size:24px;color:var(--head)}
.product-hero p{margin:0;max-width:850px;line-height:1.45}
.product-tabs{display:grid;grid-template-columns:repeat(6,minmax(120px,1fr));gap:9px;margin-bottom:18px}
.product-tab{background:var(--panel);border:1.5px solid var(--ink);padding:12px 10px;text-align:left;box-shadow:3px 3px 0 rgba(44,35,23,.14);color:var(--ink);min-width:0;overflow:hidden}
.product-tab.on{background:var(--cyan);color:var(--bg2);transform:translate(1px,1px);box-shadow:2px 2px 0 var(--ink)}
.product-tab b{display:block;font-size:13px}.product-tab small{display:block;margin-top:4px;opacity:.8;font-family:var(--mono);font-size:10px}
.scenario-bar{display:grid;grid-template-columns:1fr 1fr auto;gap:14px;align-items:end}
.scenario-bar label{margin:0}.scenario-bar .btn{margin-bottom:1px}
.range-buttons{display:flex;gap:5px;flex-wrap:wrap}
.range-buttons button{border:1px solid var(--ink);background:var(--bg2);padding:6px 9px;font-family:var(--mono);font-size:11px;color:var(--ink)}
.range-buttons button.on{background:var(--amber);font-weight:700}
.kpi-note{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:5px;line-height:1.3}
.status-stamp{display:inline-block;border:2px solid;padding:4px 10px;font-family:var(--disp);font-size:12px;letter-spacing:.6px;transform:rotate(-1deg)}
.status-stamp.pos{color:var(--green);border-color:var(--green)}.status-stamp.neg{color:var(--red);border-color:var(--red)}.status-stamp.zero{color:#8a6418;border-color:var(--amber)}
.chassis-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}
.mini-list{display:grid;gap:8px}.mini-item{border-left:4px solid var(--cyan);background:var(--soft);padding:9px 11px}
.mini-item b{font-family:var(--mono);font-size:12px}.mini-item span{display:block;color:var(--muted);font-size:11px;margin-top:3px;line-height:1.35}
.provider-row{display:grid;grid-template-columns:125px 1fr 90px;gap:10px;align-items:start;border-bottom:1px dotted var(--line);padding:10px 0}
.provider-row:last-child{border-bottom:0}.provider-row b{font-family:var(--mono);font-size:12px}.provider-row code{font-size:10px;color:var(--cyan);overflow-wrap:anywhere}.provider-row .tag{text-align:center}
.money-table input{width:92px;padding:5px 6px;border:1px solid var(--line);background:var(--bg2);font-family:var(--mono);text-align:right}
.money-table select{padding:5px;border:1px solid var(--line);background:var(--bg2);font-family:var(--mono);font-size:11px}
.source-note{font-size:11px;color:var(--muted);line-height:1.45;border-top:1px dotted var(--line);padding-top:9px;margin-top:10px}
.matrix{min-width:730px}.matrix td,.matrix th{text-align:right;font-family:var(--mono)}.matrix td:first-child,.matrix th:first-child{text-align:left;position:sticky;left:0;background:var(--panel);z-index:1}.matrix .good{color:var(--green);background:rgba(95,125,58,.08)}.matrix .bad{color:var(--red);background:rgba(181,67,42,.07)}.matrix .neutral{color:#8a6418;background:rgba(200,154,60,.08)}
.board-callout{border:2px solid var(--green);background:rgba(95,125,58,.09);padding:15px 17px;margin-bottom:18px}.board-callout b{font-family:var(--disp);font-size:17px;color:var(--green)}.board-callout p{margin:6px 0 0;line-height:1.45}
.data-badge{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;padding:3px 7px;border:1px solid var(--line);background:var(--soft)}
.twin-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:stretch;margin-bottom:18px}.twin-grid>.panel{height:100%;margin:0}
.artifact-list{display:grid;gap:9px}.artifact-card{display:block;width:100%;padding:0;background:var(--bg2);border:1.5px solid var(--ink);text-align:left;color:var(--ink);box-shadow:2px 2px 0 rgba(44,35,23,.18)}
.artifact-card:hover{background:rgba(47,110,106,.06)}.artifact-card.on{border-color:var(--cyan);box-shadow:3px 3px 0 rgba(47,110,106,.28)}
.artifact-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px;width:100%;border:0;background:transparent;text-align:left;color:var(--ink)}.artifact-head b{font-size:13px}.artifact-head small{display:block;color:var(--muted);margin-top:3px;font-family:var(--mono);font-size:10px}
.artifact-price{text-align:right;font-family:var(--mono);white-space:nowrap}.artifact-price strong{display:block;color:var(--cyan);font-size:14px}.artifact-price small{margin-top:2px}
.artifact-detail{border-top:1px dotted var(--line);padding:5px 12px 10px;background:var(--soft)}
.artifact-cost-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:8px 0;border-bottom:1px dotted var(--line);align-items:center}.artifact-cost-row:last-child{border-bottom:0}.artifact-cost-row b{font-family:var(--mono);font-size:11px}.artifact-cost-row span{display:block;color:var(--muted);font-size:10px;margin-top:2px}.artifact-cost-row .r strong{font-family:var(--mono);font-size:11px}.artifact-cost-row .r span{white-space:nowrap}
.matrix-legend{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:10px;color:var(--muted);margin:8px 0 12px}.matrix-legend i{display:inline-block;width:10px;height:10px;border:1px solid var(--ink);margin-right:5px;vertical-align:-1px}
@media(max-width:1050px){.product-tabs{grid-template-columns:repeat(3,1fr)}.chassis-grid{grid-template-columns:1fr}}
@media(max-width:700px){.main{flex:0 0 calc(100vw - 64px);width:calc(100vw - 64px);max-width:calc(100vw - 64px);overflow:hidden}.wrap{width:100%;max-width:100%;padding:18px 14px;overflow:hidden}.top{padding:12px 14px;align-items:flex-start;gap:3px;flex-direction:column}.top h1{font-size:18px}.top .yr{white-space:normal}.product-hero,.panel,.cards,.chassis-grid{min-width:0;max-width:100%}.product-tabs{grid-template-columns:repeat(2,minmax(0,1fr));max-width:100%}.product-tab small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.scenario-bar{grid-template-columns:minmax(0,1fr)}.provider-row{grid-template-columns:85px minmax(0,1fr)}.provider-row .tag{grid-column:1/3;width:max-content}.money-table input{width:78px}.twin-grid{grid-template-columns:1fr}.artifact-head{grid-template-columns:1fr}.artifact-price{text-align:left}}
@media print{.side,.top,.scenario-bar,.product-tabs .product-tab:not(.on),button{display:none!important}.main{width:100%}.wrap{max-width:none;padding:0}.panel,.card,.product-hero{box-shadow:none;break-inside:avoid}.product-tabs{display:block}.product-tab.on{display:block!important;color:var(--ink);background:var(--panel);width:100%}.chassis-grid{grid-template-columns:1fr 1fr}body{background:#fff;font-size:11px}}
</style>
</head>
<body>

<!-- ===== LOGIN / PROFILE ===== -->
<div id="gate" class="center">
  <canvas id="matrix"></canvas>
  <div class="login">
    <div class="gtag">— GrayCat · Projeto GUTO · acesso restrito —</div>
    <div class="guto-row"><img class="guto-ico" src="guto-mascote.png" alt=""><div class="guto-logo">GUTO</div></div>
    <p>Livro-Caixa & Contábil</p>
    <div id="cloudLogin" class="hidden">
      <label class="fld"><span>Operador (e-mail)</span><input id="liEmail" class="in" type="email" placeholder="voce@empresa.com" autocomplete="username"></label>
      <label class="fld"><span>Senha</span><input id="liPass" class="in" type="password" autocomplete="current-password"></label>
      <div style="display:flex;gap:8px">
        <button class="btn" style="flex:1" onclick="cloudSignIn()">Entrar</button>
        <button class="btn sec" onclick="cloudSignUp()">Criar conta</button>
      </div>
      <p id="liMsg" style="color:var(--red);font-family:var(--mono);font-size:12px;margin-top:12px"></p>
    </div>
    <div id="localLogin">
      <p style="margin-bottom:12px">▸ Selecione o operador</p>
      <div id="whoPick" class="who-pick"></div>
    </div>
  </div>
</div>

<!-- ===== APP ===== -->
<div id="app" class="hidden">
  <aside class="side">
    <div class="brand"><img class="brand-ico" src="guto-mascote.png" alt="Guto"><div class="brand-txt"><b>Guto</b><span>Livro-Caixa &amp; Contábil</span></div></div>
    <nav class="nav" id="nav">

/* ============ LÓGICA ============ */
function occMonth(m){ // ocorrências do mês m (0-11)
  const out=[];
  for(const k of S.costs){
    const mi=MA.indexOf(k.mesIni);
    if(mi<0) continue;
    let appear=false, base=0, parc="";
    if(k.periodicidade==="Mensal"){
      let mf = k.mesFim==="Indeterminado"?11:(MA.indexOf(k.mesFim)>=0?MA.indexOf(k.mesFim):mi);
      if(m>=mi && m<=mf){appear=true; base=k.valor;}
    } else { // Esporádico / Anual
      const parcelado = k.pagamento==="Parcelado";
      const q = parcelado?Math.max(1,k.qtde||1):1;
      const idx = m-mi+1;
      if(idx>=1 && idx<=q){appear=true; base=k.valor/q; if(q>1)parc=idx+"/"+q;}
    }
    if(!appear) continue;
    const pkey=k.id+"|"+m;
    const pay=S.payments[pkey]||{};
    if(pay.excluded) continue;
    const override=pay.override&&typeof pay.override==="object"?pay.override:{};
    const cost=Object.assign({},k,override);
    if(Object.prototype.hasOwnProperty.call(override,"valor")) base=Number(override.valor)||0;
    const isVar=cost.classe==="Variável";
    const hasReal=pay.valorReal!=null && pay.valorReal!=="";
    const value = (isVar && hasReal)? Number(pay.valorReal):base;
    out.push({cost, source:k, key:pkey, value, base, parcela:parc, pago:!!pay.pago,
      adjusted:Object.keys(override).length>0,
      preview:isVar && !hasReal, valorReal: hasReal?Number(pay.valorReal):null});
  }
  return out;
}
const monthTotal=m=>occMonth(m).reduce((s,o)=>s+o.value,0);
const nSoc=()=>S.settings.socios.length||1;
const perSocio=m=>monthTotal(m)/nSoc();
function monthStatus(m){let pago=0,apagar=0;for(const o of occMonth(m)){o.pago?pago+=o.value:apagar+=o.value;}return{pago,apagar};}
const yearTotal=()=>{let t=0;for(let m=0;m<12;m++)t+=monthTotal(m);return t;};

/* ---- receitas ---- */
function revOccMonth(m){ // ocorrências de receita do mês m (0-11)
  const out=[];
  for(const k of S.revenues){
    const mi=MA.indexOf(k.mesIni); if(mi<0) continue;
    let appear=false, base=0;
    if(k.periodicidade==="Mensal"){
      const mf=k.mesFim==="Indeterminado"?11:(MA.indexOf(k.mesFim)>=0?MA.indexOf(k.mesFim):mi);
      if(m>=mi && m<=mf){appear=true; base=k.valor;}
    } else { // Pontual
      if(m===mi){appear=true; base=k.valor;}
    }
    if(!appear) continue;
    const rkey=k.id+"|"+m, rc=S.receipts[rkey]||{};
    if(rc.excluded) continue;
    const override=rc.override&&typeof rc.override==="object"?rc.override:{};
    const rev=Object.assign({},k,override);
    if(Object.prototype.hasOwnProperty.call(override,"valor")) base=Number(override.valor)||0;
    const hasReal=rc.valorReal!=null && rc.valorReal!=="";
    const value=hasReal?Number(rc.valorReal):base;
    out.push({rev, source:k, key:rkey, value, base, recebido:!!rc.recebido,
      adjusted:Object.keys(override).length>0,
      preview:!rc.recebido && !hasReal, valorReal:hasReal?Number(rc.valorReal):null});
  }
  return out;
}
const revMonthTotal=m=>revOccMonth(m).reduce((s,o)=>s+o.base,0);            // previsto
const revReceived=m=>revOccMonth(m).reduce((s,o)=>s+(o.recebido?o.value:0),0); // efetivo
const revYearTotal=()=>{let t=0;for(let m=0;m<12;m++)t+=revMonthTotal(m);return t;};
const revYearReceived=()=>{let t=0;for(let m=0;m<12;m++)t+=revReceived(m);return t;};

/* ---- fechamento do mês (base: necessidade do mês) ---- */
function resultState(m){
  const gastoPrev=monthTotal(m), gastoPago=monthStatus(m).pago;
  const recPrev=revMonthTotal(m), recReceb=revReceived(m);
  const saldo=recReceb-gastoPrev;          // receita recebida − custos previstos
  const n=nSoc(), porSocio=Math.abs(saldo)/n;
  const neg=saldo<0;
  let feito=0;
  const list=S.settings.socios.map(s=>{
    const a=S.aportes[s.id+"|"+m]||{};
    if(a.feito)feito+=porSocio;
    return {socio:s, porSocio, feito:!!a.feito, data:a.data||""};
  });
  return {gastoPrev,gastoPago,recPrev,recReceb,saldo,neg,porSocio,
    abs:Math.abs(saldo),list,feito,pendente:Math.abs(saldo)-feito};
}

/* ============ PERSISTÊNCIA ============ */
const LS="guto_state_v1";
async function loadState(){
  if(CLOUD){
    const {data,error}=await sb.from("app_state").select("data").eq("id",ORG_ID).maybeSingle();
    if(error){console.warn(error);}
    const valid = data && data.data && data.data.settings && Array.isArray(data.data.costs);
    S = valid ? data.data : seed();
    migrate();
    if(!valid){ await sb.from("app_state").upsert({id:ORG_ID,data:S,updated_at:new Date().toISOString()}); }
  } else {
    const raw=localStorage.getItem(LS);
    S = raw? JSON.parse(raw): seed();
    migrate();
  }
}
function migrate(){ // garante campos novos em estados salvos antes desta versão
  if(!S) return;
  if(!Array.isArray(S.revenues)) S.revenues=[];
  if(!S.receipts || typeof S.receipts!=="object") S.receipts={};
  if(!Array.isArray(S.accounts)) S.accounts=[];
  const productDefaults=seedProductPortfolio();
  if(!S.products || !Array.isArray(S.products.features)) S.products=productDefaults;
  if(!S.products.settings) S.products.settings=productDefaults.settings;
  if(!S.products.settings.cohort) S.products.settings.cohort="mixed";
  if(!Array.isArray(S.products.settings.sources)) S.products.settings.sources=productDefaults.settings.sources;
  if((Number(S.products.version)||0)<2){
    (S.products.features||[]).forEach(f=>{
      const fresh=productDefaults.features.find(x=>x.id===f.id); if(!fresh)return;
      if(!Array.isArray(f.deliverables)) f.deliverables=fresh.deliverables;
      // O motor musical anterior estava descrito como TTS; o SSOT atual é
      // Cloud Run GPU + ACE-Step 1.5, então esta parte precisa de migração.
      if(f.id==="musica"){
        f.providers=fresh.providers; f.fixed=fresh.fixed; f.variable=fresh.variable;
      }
    });
    S.products.version=2;
  }
  if(!S.payments) S.payments={};
  if(!S.aportes) S.aportes={};
  if(!S.closures || typeof S.closures!=="object") S.closures={};
  const st=S.settings||(S.settings={});
  if(st.nomeFantasia==null) st.nomeFantasia="Gray Cat Corporation";
  if(st.razaoSocial==null) st.razaoSocial="D EMANUEL MATOS FARIAS BRANCO - DESENVOLVIMENTO DE SOFTWARE LTDA";
  if(st.cnpj==null) st.cnpj="60.891.487/0001-71";
  (st.socios||[]).forEach(s=>{ if(s.email==null) s.email=""; });
}

function closureKey(m){return S.settings.year+"-"+m;}
function isClosed(m){const c=S.closures[closureKey(m)];return !!(c&&c.closed);}
function closureInfo(m){return S.closures[closureKey(m)]||null;}

function save(){
  if(CLOUD){ clearTimeout(saveT); saveT=setTimeout(async()=>{
      await sb.from("app_state").upsert({id:ORG_ID,data:S,updated_at:new Date().toISOString()});
    },400);

  if(typeof render==="function") render();
}

function readCreds(){
  const email=(liEmail.value||"").trim(), password=liPass.value||"";
  if(!email||!password){ liMsg.textContent="Informe o operador (e-mail) e a senha."; return null; }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ liMsg.textContent="O operador deve ser um e-mail válido (ex.: voce@empresa.com)."; return null; }
  if(password.length<6){ liMsg.textContent="A senha precisa ter ao menos 6 caracteres."; return null; }
  liMsg.textContent=""; return {email,password};
}
async function cloudSignIn(){
  const cr=readCreds(); if(!cr) return;
  const {data,error}=await sb.auth.signInWithPassword(cr);
  if(error){liMsg.textContent=error.message;return;}
  currentUser={id:data.user.id,name:cr.email,email:cr.email}; await enter();
}

  const cr=readCreds(); if(!cr) return;
  const {error}=await sb.auth.signUp(cr);
  liMsg.textContent = error? error.message : "Conta criada! Confirme o e-mail (se exigido) e clique em Entrar.";

function saveCost(id,isNew){
  const g=x=>document.getElementById(x).value;
  const per=g("f_per");
  const obj={id, desc:g("f_desc").trim(), tipo:g("f_tipo"), periodicidade:per, classe:g("f_cls"),
    valor:Number(g("f_val"))||0, mesIni:g("f_ini"),
    mesFim: per==="Mensal"? g("f_fim"):"",
    pagamento: per==="Mensal"? "À vista": g("f_pag"),

    dia:Number(g("f_dia"))||5, metodo:g("f_met"), obs:g("f_obs").trim()};

}

/* ============ PRODUTOS / CENTROS DE CUSTO ============ */
const PROD_USERS=[10,100,1000,10000,100000,1000000];
const PROD_GENS=[10,100,1000,10000,100000];
function prodFeature(id=productId){
  const list=S.products&&Array.isArray(S.products.features)?S.products.features:[];
  return list.find(x=>x.id===id)||list[0];
}
function prodVolume(item,users,gens){return item.driver==="user"?users:gens;}
function deliveryCostTotal(item,users,gens){
  if(item.driver==="fixed") return Number(item.amount)||0;
  const volume=prodVolume(item,users,gens);
  return Math.max(0,volume-(Number(item.freeQuota)||0))*(Number(item.unitCost)||0);
}
function deliveryEconomics(delivery,users,gens){
  const lines=(delivery.costs||[]).map(x=>Object.assign({},x,{total:deliveryCostTotal(x,users,gens)}));
  const total=lines.reduce((s,x)=>s+x.total,0);
  return {lines,total,perArtifact:total/Math.max(1,gens)};
}
function prodRevenueEnabled(item,cohort){
  const premium=(item.provider||"").toLowerCase().includes("app store");
  if(cohort==="free") return !premium;
  if(cohort==="premium") return premium;
  return true;
}
function prodEconomics(f,users,gens,cohort){
  cohort=cohort||(S.products.settings&&S.products.settings.cohort)||"mixed";
  const fixed=(f.fixed||[]).reduce((s,x)=>s+(Number(x.amount)||0),0);
  const variable=(f.variable||[]).reduce((s,x)=>{
    const volume=prodVolume(x,users,gens),billable=Math.max(0,volume-(Number(x.freeQuota)||0));
    return s+billable*(Number(x.unitCost)||0);
  },0);
  const revenue=(f.revenue||[]).filter(x=>prodRevenueEnabled(x,cohort)).reduce((s,x)=>s+prodVolume(x,users,gens)*(Number(x.unitRevenue)||0),0);
  const net=revenue-fixed-variable;
  const contribution=revenue-variable;
  const margin=revenue>0?net/revenue:0;
  const payback=contribution>0?fixed/contribution:null;
  const userRev=(f.revenue||[]).filter(x=>x.driver==="user"&&prodRevenueEnabled(x,cohort)).reduce((s,x)=>s+(Number(x.unitRevenue)||0),0);
  const userCost=(f.variable||[]).filter(x=>x.driver==="user").reduce((s,x)=>s+(Number(x.unitCost)||0),0);
  const genRev=(f.revenue||[]).filter(x=>x.driver!=="user"&&prodRevenueEnabled(x,cohort)).reduce((s,x)=>s+(Number(x.unitRevenue)||0),0)*gens;
  const genCost=(f.variable||[]).filter(x=>x.driver!=="user").reduce((s,x)=>{
    return s+Math.max(0,gens-(Number(x.freeQuota)||0))*(Number(x.unitCost)||0);
  },0);
  const userContribution=userRev-userCost;
  const breakEvenUsers=userContribution>0?Math.max(0,Math.ceil((fixed+genCost-genRev)/userContribution)):null;
  return {fixed,variable,revenue,net,contribution,margin,payback,breakEvenUsers};
}
function prodStatus(net){return net>1?{cls:"pos",label:"Superavitária"}:net< -1?{cls:"neg",label:"Deficitária"}:{cls:"zero",label:"0 a 0"};}
function compactNum(n){return Number(n).toLocaleString("pt-BR",{notation:n>=10000?"compact":"standard",maximumFractionDigits:1});}
function prodBasisClass(b){return b==="Cadastro Guto"||b==="Tabela oficial"?"pago":"prev";}
function portfolioEconomics(users,gens){
  return S.products.features.reduce((a,f)=>{const e=prodEconomics(f,users,gens);Object.keys(a).forEach(k=>a[k]+=e[k]||0);return a;},{fixed:0,variable:0,revenue:0,net:0});
}
function setProdScenario(kind,value){S.products.settings[kind]=kind==="cohort"?String(value):Number(value);S.products.settings.updatedAt=new Date().toISOString().slice(0,10);save();}
function setProdNum(featureId,section,index,field,value){
  const f=prodFeature(featureId),row=f&&f[section]&&f[section][index]; if(!row)return;
  row[field]=Math.max(0,Number(value)||0);S.products.settings.updatedAt=new Date().toISOString().slice(0,10);save();
}

function toggleProductRevenue(index){productRevenueIndex=productRevenueIndex===index?-1:index;productDeliveryId="";render();}

function vProd(){
  const ps=S.products.settings||{},users=Number(ps.users)||1000,gens=Number(ps.generations)||1000,cohort=ps.cohort||"mixed";
  const f=prodFeature(); if(!f)return `<div class="panel"><p>Nenhum centro de custo cadastrado.</p></div>`;
  const E=prodEconomics(f,users,gens),status=prodStatus(E.net),port=portfolioEconomics(users,gens);
  const allRows=[...(f.fixed||[]),...(f.variable||[]),...(f.revenue||[])];
  const verified=allRows.filter(x=>x.basis==="Cadastro Guto"||x.basis==="Tabela oficial").length;
  const dataCoverage=allRows.length?Math.round(verified/allRows.length*100):0;
  const providers=(f.providers||[]).map(p=>`<div class="provider-row"><b>${esc(p.name)}</b><div><strong>${esc(p.service)}</strong><br><code>${esc(p.endpoint)}</code><div class="source-note" style="border:0;padding:3px 0 0;margin:0">Dependência: ${esc(p.dependency)}</div></div><span class="tag ${p.status==="Ativo"?"pago":"prev"}">${esc(p.status)}</span></div>`).join("");

  const deliveryCards=(f.deliverables||[]).map(d=>{const D=deliveryEconomics(d,users,gens),open=productDeliveryId===d.id;const detail=D.lines.map(x=>`<div class="artifact-cost-row"><div><b>${esc(x.provider)}</b><span>${esc(x.service)} · ${prodDriverLabel(x)}${x.freeQuota?` · cota ${compactNum(x.freeQuota)}`:""}</span></div><div class="r"><strong>${fmt(x.total/Math.max(1,gens))} / ${esc(d.unit)}</strong><span>${fmt(x.total)} no cenário</span></div></div>`).join("");return `<div class="artifact-card ${open?"on":""}"><button class="artifact-head" onclick="toggleProductDelivery('${d.id}')"><div><b>${esc(d.name)}</b><small>clique para discriminar o custo por provedor</small></div><div class="artifact-price"><strong>${fmt(D.perArtifact)} / ${esc(d.unit)}</strong><small>${fmt(D.total)} no cenário</small></div></button>${open?`<div class="artifact-detail">${detail}<div class="source-note">Custo efetivo unitário = custos diretos do cenário ÷ ${compactNum(gens)} unidades entregues. Custos ligados à base de usuários e custos fixos são rateados automaticamente.</div></div>`:""}</div>`;}).join("");
  const revenueCards=(f.revenue||[]).map((x,i)=>{const enabled=prodRevenueEnabled(x,cohort),total=enabled?prodVolume(x,users,gens)*(Number(x.unitRevenue)||0):0,perArtifact=total/Math.max(1,gens),open=productRevenueIndex===i;return `<div class="artifact-card ${open?"on":""}" style="${enabled?"":"opacity:.52"}"><button class="artifact-head" onclick="toggleProductRevenue(${i})"><div><b>${esc(x.name)}</b><small>${enabled?`movida por ${x.driver==="user"?"usuários ativos":"operações de valor"}`:"fora da coorte selecionada"}</small></div><div class="artifact-price"><strong>${fmt(perArtifact)} / operação</strong><small>${fmt(total)} no cenário</small></div></button>${open?`<div class="artifact-detail"><div class="artifact-cost-row"><div><b>${esc(x.provider)}</b><span>${esc(x.note)}</span></div><div class="r"><strong>${fmt(Number(x.unitRevenue)||0)} / ${x.driver==="user"?"usuário":"operação"}</strong><span>${esc(x.basis)}</span></div></div><div class="source-note">A receita efetiva por operação muda conforme a relação entre usuários e gerações. Na coorte gratuita entram anúncios; na premium entram apenas receitas de assinatura atribuídas.</div></div>`:""}</div>`;}).join("");
  const matrixRows=PROD_GENS.map(g=>`<tr><th>${compactNum(g)} gerações</th>${PROD_USERS.map(u=>prodMoneyCell(prodEconomics(f,u,g).net)).join("")}</tr>`).join("");
  const portfolioCards=S.products.features.map(x=>{const e=prodEconomics(x,users,gens),s=prodStatus(e.net);return `<div class="mini-item" style="border-left-color:${s.cls==="pos"?"var(--green)":s.cls==="neg"?"var(--red)":"var(--amber)"}"><b>${x.icon} ${esc(x.name)} · ${fmt(e.net)}</b><span>${s.label} · receita ${fmt(e.revenue)} · custo ${fmt(e.fixed+e.variable)}</span></div>`;}).join("");
  return `
  <div class="product-hero"><h2>Produtos como unidades econômicas</h2><p>Uma leitura de conselho que conecta <b>o que entregamos</b>, <b>de quem dependemos</b>, <b>quanto custa servir</b> e <b>como cada feature se paga</b>. Premissas são mensais, editáveis e separadas de faturas confirmadas.</p></div>
  <div class="product-tabs">${S.products.features.map(x=>{const e=prodEconomics(x,users,gens),s=prodStatus(e.net);return `<button class="product-tab ${x.id===f.id?"on":""}" onclick="productId='${x.id}';productDeliveryId='';productRevenueIndex=-1;render()"><b>${x.icon} ${esc(x.name)}</b><small>${s.label} · ${fmt(e.net)}</small></button>`;}).join("")}</div>
  <div class="panel scenario-bar">
    <label class="fld"><span>Usuários ativos da feature / mês</span><div class="range-buttons">${PROD_USERS.map(x=>`<button class="${x===users?"on":""}" onclick="setProdScenario('users',${x})">${compactNum(x)}</button>`).join("")}</div></label>
    <label class="fld"><span>Operações de valor / gerações / mês</span><div class="range-buttons">${PROD_GENS.map(x=>`<button class="${x===gens?"on":""}" onclick="setProdScenario('generations',${x})">${compactNum(x)}</button>`).join("")}</div></label>
    <div><label class="fld"><span>Coorte econômica</span><div class="range-buttons"><button class="${cohort==="free"?"on":""}" onclick="setProdScenario('cohort','free')">Gratuitos</button><button class="${cohort==="mixed"?"on":""}" onclick="setProdScenario('cohort','mixed')">Base mista</button><button class="${cohort==="premium"?"on":""}" onclick="setProdScenario('cohort','premium')">Premium</button></div></label><button class="btn sec" onclick="window.print()">🖨️ Conselho / PDF</button></div>
  </div>
  <div class="cards">
    <div class="card green"><div class="lbl">Receita atribuída</div><div class="val">${fmt(E.revenue)}</div><div class="sub">coorte ${cohort==="free"?"gratuita (só ads)":cohort==="premium"?"premium (sem ads)":"mista"}</div></div>
    <div class="card"><div class="lbl">Custo de servir</div><div class="val">${fmt(E.fixed+E.variable)}</div><div class="sub">fixo ${fmt(E.fixed)} · variável ${fmt(E.variable)}</div></div>
    <div class="card ${status.cls==="pos"?"green":status.cls==="neg"?"red":"amber"}"><div class="lbl">Saldo líquido da feature</div><div class="val">${fmt(E.net)}</div><div class="sub"><span class="status-stamp ${status.cls}">${status.label}</span></div></div>
    <div class="card amber"><div class="lbl">Margem líquida</div><div class="val">${(E.margin*100).toFixed(1)}%</div><div class="sub">${E.breakEvenUsers==null?"break-even depende do volume de uso":compactNum(E.breakEvenUsers)+" usuários p/ break-even"}</div></div>
    <div class="card"><div class="lbl">Tempo p/ compensar fixo</div><div class="val">${E.payback==null?"—":E.payback.toFixed(1)+" mês"+(E.payback===1?"":"es")}</div><div class="sub">com contribuição do cenário atual</div></div>
    <div class="card"><div class="lbl">Cobertura por fonte confirmada</div><div class="val">${dataCoverage}%</div><div class="sub">${verified}/${allRows.length} linhas ancoradas em cadastro/tabela</div></div>
  </div>
  <div class="board-callout"><b>Por que seguir investindo em ${esc(f.name)}</b><p>${esc(f.thesis)}</p></div>
  <div class="twin-grid">
    <div class="panel"><h3>${f.icon} O que é entregue <span class="pill">${esc(f.stage)}</span></h3><p class="muted">Cada item representa uma unidade concreta de valor. Abra para ver o custo efetivo de cada provedor no cenário selecionado.</p><div class="artifact-list">${deliveryCards}</div></div>
    <div class="panel"><h3>💰 Fontes de receita <span class="pill">${cohort==="free"?"gratuitos":cohort==="premium"?"premium":"base mista"}</span></h3><p class="muted">A mesma ótica por unidade: receita efetiva por operação e total mensal, já respeitando a coorte selecionada.</p><div class="artifact-list">${revenueCards}</div></div>
  </div>
  <div class="panel"><h3>Matriz de saldo líquido mensal · ${esc(f.name)}</h3><p class="muted">Eixo X = usuários ativos. Eixo Y = operações de valor. A cor mostra superávit ou déficit; o tamanho mostra a intensidade do resultado.</p><div class="matrix-legend"><span><i style="background:rgba(95,125,58,.7)"></i>superavitário</span><span><i style="background:rgba(181,67,42,.7)"></i>deficitário</span><span><i style="background:rgba(200,154,60,.7)"></i>0 a 0</span><span>● contorno forte = cenário selecionado</span></div><div style="height:390px"><canvas id="prodMatrixChart"></canvas></div><details style="margin-top:12px"><summary style="cursor:pointer;font-family:var(--mono);font-weight:700">Ver valores exatos da matriz</summary><div style="overflow:auto;margin-top:10px"><table class="matrix"><thead><tr><th>Volume × MAU</th>${PROD_USERS.map(u=>`<th>${compactNum(u)} usuários</th>`).join("")}</tr></thead><tbody>${matrixRows}</tbody></table></div></details></div>
  <div class="chassis-grid"><div class="panel"><h3>Provedores, endpoints e dependências</h3>${providers}</div><div class="panel"><h3>Leitura do portfólio neste cenário</h3><div class="cards" style="grid-template-columns:1fr 1fr"><div class="card green"><div class="lbl">Receita total</div><div class="val" style="font-size:20px">${fmt(port.revenue)}</div></div><div class="card ${port.net>=0?"green":"red"}"><div class="lbl">Saldo portfólio</div><div class="val" style="font-size:20px">${fmt(port.net)}</div></div></div><div class="mini-list">${portfolioCards}</div><p class="source-note">Leitura comparável: aplica a mesma base de usuários e operações a cada centro de custo.</p></div></div>
  <div class="twin-grid"><div class="panel"><h3>Riscos sob controle</h3><div class="mini-list">${f.risks.map(x=>`<div class="mini-item" style="border-left-color:var(--red)"><b>${esc(x)}</b></div>`).join("")}</div></div><div class="panel"><h3>Próximas alavancas</h3><div class="mini-list">${f.next.map(x=>`<div class="mini-item" style="border-left-color:var(--green)"><b>${esc(x)}</b></div>`).join("")}</div></div></div>
  <div class="panel"><h3>Custos fixos mensais <span class="pill">total ${fmt(E.fixed)}</span></h3><div style="overflow:auto"><table class="money-table"><thead><tr><th>Componente</th><th>Provedor</th><th>Qualidade da fonte</th><th class="r">R$ / mês</th></tr></thead><tbody>${fixedRows}</tbody></table></div></div>
  <div class="panel"><h3>Custos variáveis <span class="pill">cenário ${fmt(E.variable)}</span></h3><div style="overflow:auto"><table class="money-table"><thead><tr><th>Componente</th><th>Provedor / driver</th><th>R$ unitário</th><th>Cota grátis / mês</th><th class="r">Custo cenário</th></tr></thead><tbody>${varRows}</tbody></table></div><p class="source-note">Custo variável = máximo entre zero e (volume − cota gratuita) × custo unitário. Cotas de conta compartilhadas devem ser rateadas com cautela para não contar o benefício duas vezes.</p></div>
  <div class="panel"><h3>Governança da decisão</h3><div class="grid2"><div><p><span class="data-badge">Revisão ${esc(f.reviewed)}</span> <span class="data-badge">Confiança ${esc(f.confidence)}</span> <span class="data-badge">Dono ${esc(f.owner)}</span></p><p class="muted">Verde confirma fonte externa/cadastro; “Estimativa” exige conciliação com fatura e telemetria. Última alteração das premissas: ${esc(ps.updatedAt||f.reviewed)}.</p></div><div><p><b>Critério para conselho:</b> investir quando a contribuição unitária é positiva e existe caminho mensurável para diluir o custo fixo. Manter experimento controlado quando o saldo ainda é negativo, mas a feature aumenta retenção, aquisição ou conversão premium do portfólio.</p></div></div><h3 style="margin-top:18px">Fontes oficiais de preço e quota</h3><div class="mini-list">${(ps.sources||[]).map(x=>`<div class="mini-item"><b><a href="${esc(x.url)}" target="_blank" rel="noopener" style="color:var(--cyan)">${esc(x.name)}</a></b><span>${esc(x.url)}</span></div>`).join("")}</div><div class="toolbar" style="margin-top:12px"><button class="btn danger sm" onclick="resetProductAssumptions()">Restaurar premissas iniciais</button></div></div>`;
}

function drawProd(){
  const cv=document.getElementById("prodMatrixChart"); if(!cv||!window.Chart)return;
  const f=prodFeature(),ps=S.products.settings||{},users=Number(ps.users)||1000,gens=Number(ps.generations)||1000;
  const raw=[];PROD_GENS.forEach(g=>PROD_USERS.forEach(u=>{const e=prodEconomics(f,u,g),s=prodStatus(e.net);raw.push({x:u,y:g,net:e.net,status:s.label,selected:u===users&&g===gens});}));
  const maxAbs=Math.max(1,...raw.map(x=>Math.abs(x.net)));
  raw.forEach(x=>{x.r=7+15*Math.sqrt(Math.abs(x.net)/maxAbs);});
  charts.push(new Chart(cv,{type:"bubble",data:{datasets:[{data:raw,backgroundColor:raw.map(x=>x.net>1?"rgba(95,125,58,.68)":x.net< -1?"rgba(181,67,42,.66)":"rgba(200,154,60,.72)"),borderColor:raw.map(x=>x.selected?"#1e1810":"rgba(44,35,23,.58)"),borderWidth:raw.map(x=>x.selected?4:1.2)}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{title:items=>items.length?`${compactNum(items[0].raw.x)} usuários × ${compactNum(items[0].raw.y)} operações`:"",label:ctx=>[`Saldo: ${fmt(ctx.raw.net)}`,ctx.raw.status]}}},scales:{x:{type:"logarithmic",min:10,max:1000000,title:{display:true,text:"Usuários ativos da feature / mês"},ticks:{callback:v=>PROD_USERS.includes(Number(v))?compactNum(Number(v)):""}},y:{type:"logarithmic",min:10,max:100000,title:{display:true,text:"Operações de valor / gerações / mês"},ticks:{callback:v=>PROD_GENS.includes(Number(v))?compactNum(Number(v)):""}}}}}));
}

/* ============ CONTÁBIL / ANUAL ============ */
function vCont(){
  const rows=MA.map((ab,i)=>{const st=monthStatus(i);const rec=revReceived(i);return{ab,tot:monthTotal(i),pago:st.pago,apagar:st.apagar,rec,saldo:rec-monthTotal(i),soc:perSocio(i)};});
  const tot=yearTotal(), pagoY=rows.reduce((s,r)=>s+r.pago,0), apagarY=rows.reduce((s,r)=>s+r.apagar,0);
  const recY=revYearReceived(), recPrevY=revYearTotal(), saldoY=recY-tot;
  const catY=TIPOS.map(t=>{let v=0;for(let i=0;i<12;i++)v+=occMonth(i).filter(o=>o.cost.tipo===t).reduce((a,o)=>a+o.value,0);return{t,v};}).filter(x=>x.v>0);
  let fix=0,vr=0;for(let i=0;i<12;i++)occMonth(i).forEach(o=>o.cost.classe==="Fixo"?fix+=o.value:vr+=o.value);
  return `<div class="toolbar"><button class="btn sec" onclick="exportJSON()">⬇️ Backup (JSON)</button>
    <button class="btn sec" onclick="exportCSV()">⬇️ Exportar CSV</button>
    <button class="btn sec" onclick="window.print()">🖨️ Imprimir / PDF</button><span class="sp"></span></div>
  <div class="cards">
    <div class="card"><div class="lbl">Custo no ano</div><div class="val">${fmt(tot)}</div><div class="sub">pago ${fmt(pagoY)}</div></div>
    <div class="card green"><div class="lbl">Receita recebida (ano)</div><div class="val">${fmt(recY)}</div><div class="sub">prevista ${fmt(recPrevY)}</div></div>
    <div class="card ${saldoY<0?"red":"green"}"><div class="lbl">Resultado do ano</div><div class="val">${fmt(saldoY)}</div><div class="sub">recebido − custo</div></div>
    <div class="card amber"><div class="lbl">Custo por sócio / ano (÷${nSoc()})</div><div class="val">${fmt(tot/nSoc())}</div></div>
  </div>
  <div class="grid2">
    <div class="panel" style="overflow:auto"><h3>Resumo mensal</h3><table><thead><tr><th>Mês</th><th class="r">Custo</th><th class="r">Receita</th><th class="r">Pago</th><th class="r">Saldo</th><th class="r">/sócio</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td>${r.ab}</td><td class="r">${fmt(r.tot)}</td><td class="r in-up">${fmt(r.rec)}</td><td class="r">${fmt(r.pago)}</td><td class="r ${r.saldo<0?"in-dn":"in-up"}">${fmt(r.saldo)}</td><td class="r">${fmt(r.soc)}</td></tr>`).join("")}
    </tbody><tfoot><tr><th>Ano</th><th class="r">${fmt(tot)}</th><th class="r">${fmt(recY)}</th><th class="r">${fmt(pagoY)}</th><th class="r">${fmt(saldoY)}</th><th class="r">${fmt(tot/nSoc())}</th></tr></tfoot></table></div>
    <div class="panel"><h3>Por categoria (ano)</h3><canvas id="cCatY" height="150"></canvas>
      <table style="margin-top:12px"><tbody>
      ${catY.map(x=>`<tr><td>${x.t}</td><td class="r">${fmt(x.v)}</td><td class="r muted">${(x.v/tot*100).toFixed(1)}%</td></tr>`).join("")}
      <tr><th>Fixo</th><th class="r">${fmt(fix)}</th><th class="r muted">${(fix/tot*100||0).toFixed(1)}%</th></tr>
      <tr><th>Variável</th><th class="r">${fmt(vr)}</th><th class="r muted">${(vr/tot*100||0).toFixed(1)}%</th></tr>
      </tbody></table></div>
  </div>`;
}
function drawCont(){
  const tot=yearTotal();

/* ============ EXPORT / IMPORT ============ */
function exportJSON(){dl("guto_backup.json",JSON.stringify(S,null,2),"application/json");}
function importJSON(file){const r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);save();alert("Backup restaurado.");}catch(e){alert("Arquivo inválido.");}};r.readAsText(file);}
function exportCSV(){
  let rows=[["Mov","Mes","Venc","Descricao","Tipo","Periodicidade","Classe","Valor","Parcela","Metodo","Status"]];
  for(let m=0;m<12;m++)occMonth(m).forEach(o=>rows.push(["Saida",MA[m],String(o.cost.dia||5).padStart(2,"0")+"/"+String(m+1).padStart(2,"0"),
    o.cost.desc,o.cost.tipo,o.cost.periodicidade,o.cost.classe,(-o.value).toFixed(2),o.parcela,o.cost.metodo,o.pago?"Pago":"A pagar"]));
  for(let m=0;m<12;m++)revOccMonth(m).forEach(o=>rows.push(["Entrada",MA[m],String(o.rev.dia||5).padStart(2,"0")+"/"+String(m+1).padStart(2,"0"),
    o.rev.desc,"Receita",o.rev.periodicidade,"",o.value.toFixed(2),"",o.rev.metodo,o.recebido?"Recebido":"A receber"]));
  dl("guto_extrato_"+S.settings.year+".csv",rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(";")).join("\n"),"text/csv");
}
function dl(name,content,type){const b=new Blob([content],{type});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;a.click();}

/* ============ UTIL / MODAL ============ */
function esc(s){return String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function showModal(html){let o=document.createElement("div");o.className="ov";o.id="ov";o.innerHTML=`<div class="modal">${html}</div>`;o.onclick=e=>{if(e.target===o)closeModal();};document.body.appendChild(o);}
function closeModal(){const o=document.getElementById("ov");if(o)o.remove();}

/* ============ MATRIX RAIN (login) ============ */
(function(){
  const cv=document.getElementById("matrix"); if(!cv) return;
  const ctx=cv.getContext("2d");
  const glyphs="ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789$%#&*@=+-/.,;:GUTO".split("");
  let cols=[], w=0, h=0, font=18;
  function resize(){
    w=cv.width=cv.clientWidth; h=cv.height=cv.clientHeight;
    const n=Math.floor(w/font); cols=Array.from({length:n},()=>Math.random()*-50);
  }
  function draw(){
    const gate=document.getElementById("gate");
    if(gate && !gate.classList.contains("hidden")){
      ctx.fillStyle="rgba(231,220,196,.10)"; ctx.fillRect(0,0,w,h);   // rastro creme
      ctx.font=font+"px 'Courier Prime',monospace";
      for(let i=0;i<cols.length;i++){
        const x=i*font, y=cols[i]*font;
        const ch=glyphs[(Math.random()*glyphs.length)|0];
        ctx.fillStyle="rgba(44,35,23,.75)"; ctx.fillText(ch,x,y);        // letra entintada
        ctx.fillStyle="rgba(47,110,106,.45)"; ctx.fillText(ch,x,y-font); // rastro teal desbotado
        if(y>h && Math.random()>0.975) cols[i]=Math.random()*-20;
        cols[i]+=0.45;   // datilografia lenta
      }
    }
    requestAnimationFrame(draw);
  }
  const reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  resize(); window.addEventListener("resize",resize);
  if(reduce){ ctx.fillStyle="rgba(231,220,196,.92)"; ctx.fillRect(0,0,w,h); } else { draw(); }
})();
